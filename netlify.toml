[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# ============================================
# Security Headers - alle Seiten
# ============================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://identity.netlify.com https://unpkg.com https://esm.sh https://*.elevenlabs.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://*.elevenlabs.io; connect-src 'self' https://identity.netlify.com https://script.google.com https://script.googleusercontent.com https://esm.sh https://*.elevenlabs.io wss://*.elevenlabs.io wss://api.us.elevenlabs.io; frame-src https://identity.netlify.com https://maps.google.com https://www.google.com https://*.elevenlabs.io; worker-src 'self' blob:; object-src 'none'; base-uri 'self'"

# ============================================
# CORS und Caching fuer die API
# ============================================
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, no-cache"

# ============================================
# Caching: Statische Assets (Bilder, Fonts)
# ============================================
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

# Font files are content-hashed (gf-<hash>.woff2) so they can be cached forever —
# without this they fell through to Netlify's must-revalidate default and revalidated every load.
[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# JS/CSS are NOT content-hashed, so a long max-age serves stale code after a deploy.
# max-age=0 + must-revalidate keeps them cached but forces a quick conditional check
# (ETag → 304 if unchanged), so every deploy is picked up immediately by all visitors.
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# ============================================
# Sitemap & Robots
# ============================================
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ============================================
# Domain canonicalization (non-www -> www, 301)
# ============================================
[[redirects]]
  from = "https://pmk-berlin.de/*"
  to = "https://www.pmk-berlin.de/:splat"
  status = 301
  force = true

# ============================================
# Admin Redirect (Legacy URL)
# ============================================
[[redirects]]
  from = "/admin/events.html"
  to = "/admin/"
  status = 301

# ============================================
# Security: block internal/reference files from public serving
# (the Apps Script source + planning docs contain the admin PIN; archive
#  holds stale prompts). These ship because publish=".", so 404 them.
# ============================================
[[redirects]]
  from = "/admin/google-apps-script.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/archive/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.planning/*"
  to = "/404.html"
  status = 404
  force = true

# Internal/build files that ship because publish="." — 404 them so they are not
# publicly readable (agent prompt leaks the bot's instructions + agent id; the
# npm files leak the dependency tree).
[[redirects]]
  from = "/elevenlabs-agent-prompt.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

