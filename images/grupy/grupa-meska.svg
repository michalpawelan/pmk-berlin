<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Grupa Męska — emblemat">
  <title>Grupa Męska</title>
  <!-- Outer round medallion -->
  <circle cx="100" cy="100" r="86" fill="#f5f1ea" stroke="#a68b5b" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#a68b5b" stroke-width="0.6" opacity="0.6"/>

  <!-- Cross above figures -->
  <g fill="#8a7248">
    <rect x="97" y="38" width="6" height="28" rx="0.5"/>
    <rect x="88" y="46" width="24" height="6" rx="0.5"/>
  </g>

  <!-- Two stylized male figures, side-by-side, shoulders touching -->
  <g fill="#a68b5b">
    <!-- Left figure -->
    <circle cx="78" cy="86" r="10"/>
    <path d="M64 152 L64 116 Q64 100 78 100 Q92 100 92 116 L92 152 Z"/>
    <!-- Right figure -->
    <circle cx="122" cy="86" r="10"/>
    <path d="M108 152 L108 116 Q108 100 122 100 Q136 100 136 116 L136 152 Z"/>
  </g>

  <!-- Connecting arch (brotherhood) -->
  <path d="M78 102 Q100 92 122 102" fill="none" stroke="#8a7248" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Subtle inscription arc text -->
  <defs>
    <path id="arc-bottom" d="M 36 110 A 64 64 0 0 0 164 110"/>
  </defs>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="600" letter-spacing="2.4" fill="#8a7248">
    <textPath href="#arc-bottom" startOffset="50%" text-anchor="middle">GRUPA MĘSKA</textPath>
  </text>
</svg>
